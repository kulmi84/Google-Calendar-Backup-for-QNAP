name: Build QPKG

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version metadata
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$(sed -n 's/^QPKG_VER="\(.*\)"/\1/p' qpkg/qpkg.cfg)" = "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/}" = "v${version}"
          fi

      - name: Test application
        run: npm test

      - name: Install QDK 2.5.3
        run: |
          wget -q https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y ./qdk_2.5.3_amd64.deb

      - name: Download QTS-compatible Node.js x86_64 runtime
        run: |
          set -euo pipefail
          version=v22.23.3
          archive="node-${version}-linux-x64-glibc-217.tar.xz"
          base="https://unofficial-builds.nodejs.org/download/release/${version}"
          curl -fsSLo "/tmp/${archive}" "${base}/${archive}"
          curl -fsSLo /tmp/SHASUMS256.txt "${base}/SHASUMS256.txt"
          (cd /tmp && grep -F "  ${archive}" SHASUMS256.txt | sha256sum -c -)
          tar -xJf "/tmp/${archive}" -C /tmp
          node_bin="/tmp/node-${version}-linux-x64-glibc-217/bin/node"
          test "$("$node_bin" --version)" = "$version"
          required="$(readelf --version-info "$node_bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          echo "Maximum required glibc: $required"
          test "$(printf '%s\n' "$required" GLIBC_2.17 | sort -V | tail -1)" = GLIBC_2.17
          echo "NODE_BIN=$node_bin" >> "$GITHUB_ENV"

      - name: Prepare QDK project
        run: |
          chmod +x scripts/prepare-qdk-project.sh
          NODE_BIN="$NODE_BIN" scripts/prepare-qdk-project.sh
          sudo chown -R root:root build/GoogleCalendarBackup

      - name: Build with QDK
        run: |
          sudo qbuild --root build/GoogleCalendarBackup --build-arch x86_64 --build-dir "$GITHUB_WORKSPACE/dist"
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -lh dist

      - name: Verify QPKG
        run: |
          set -euo pipefail
          pkg="$(find dist -maxdepth 1 -name '*.qpkg' -print -quit)"
          test -n "$pkg"
          qbuild --query info "$pkg"
          md5sum -c "$pkg.md5"
          python3 - "$pkg" <<'PY'
          import io
          import json
          import pathlib
          import re
          import sys
          import tarfile

          package = pathlib.Path(sys.argv[1]).read_bytes()
          header = package[:20000].decode('utf-8', errors='replace')
          script = int(re.search(r'^script_len=(\d+)$', header, re.M).group(1))
          control = int(re.search(r'^offset=\$\(/usr/bin/expr \$script_len \+ (\d+)\)', header, re.M).group(1))
          data_size = int(re.search(r'^offset=\$\(/usr/bin/expr \$offset \+ (\d+)\)', header, re.M).group(1))
          payload = package[script + control:script + control + data_size]
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = {member.name.removeprefix('./'): member for member in archive}
              metadata = json.load(archive.extractfile(members['app/package.json']))
              expected = json.loads(pathlib.Path('package.json').read_text())['version']
              assert metadata['version'] == expected, 'Embedded application version mismatch'
              assert pathlib.Path(sys.argv[1]).name == f'GoogleCalendarBackup_{expected}_x86_64.qpkg'
          required = ['GoogleCalendarBackup.sh', 'bin/node', 'app/src/folders.js',
                      'app/public/index.html', '.qpkg_icon.gif', 'app/LICENSE',
                      'app/NODEJS-LICENSE', 'app/THIRD_PARTY_NOTICES.md']
          for name in required:
              assert name in members, f'Missing QPKG payload file: {name}'
          assert members['GoogleCalendarBackup.sh'].mode & 0o111
          assert members['bin/node'].mode & 0o111
          assert members['app/NODEJS-LICENSE'].size > 0
          print('Verified QPKG payload:', ', '.join(required))
          PY
          file "$pkg"
          (cd dist && sha256sum "$(basename "$pkg")" > "$(basename "$pkg").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: GoogleCalendarBackup-qpkg
          path: |
            dist/*.qpkg
            dist/*.sha256
          if-no-files-found: error

      - name: Prepare draft GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          pkg="$(find dist -maxdepth 1 -name '*.qpkg' -print -quit)"
          test -n "$pkg"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; keeping the published installer."
            exit 0
          fi
          test "$(sed -n 's/^QPKG_VER="\(.*\)"/\1/p' qpkg/qpkg.cfg)" = "$version"
          notes="docs/releases/${version}.md"
          test -s "$notes"
          release_flags=(--draft)
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "v${version}" "$pkg" "$pkg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Google Calendar Backup v${version}" \
            --notes-file "$notes" \
            "${release_flags[@]}"
